<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volunet - Dashboard</title>
    <!-- Bootstrap CSS por CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Bootstrap Iconspor CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- CSS -->
    <link href="css/main.css" rel="stylesheet">
</head>
<body>
    <!-- Barra de navegación -->     
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand d-flex aling-items-center" href="index.html">
                <img src="/assets/img/logo_volunet.png" alt="Logo Volunte" height="36" class="me-2" style="max-width:130px; object-fit:contain;">                
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navBarMain" aria-controls="navMain" aria-expanded="false" aria-label="Mostrar menú">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse " id="navBarMain">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 gap-4">
                    <li class="nav-item"><a class="nav-link" href="index.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link active fw-semibold" aria-current="page" href="voluntariados.html">Gestión de voluntarioados</a></li>
                    <li class="nav-item"><a class="nav-link" href="usuarios.html">Gestión de usuarios</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
                    <li class="nav-item d-flex algn-items-center ms-3">
                        <span id="usuarioActivo" class="text-secondary" aria-label="Usuario actual">
                            <i class="bi bi-person-circle fs-5 me-1"></i>
                            -no login-
                        </span>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- CONTENIDO -->
    <main class="container my-4" id="mainContent">
    <div class="row align-items-center mb-4">
  <div class="col-12 col-md">
    <h1 class="mb-2 mb-md-0">Gestión de Voluntariados</h1>
  </div>
  <div class="col-12 col-md-auto d-flex justify-content-md-end justify-content-center">
    <button id="btnNuevo" class="btn btn-primary w-100 w-md-auto">
      <i class="bi bi-plus-circle me-1"></i> Añadir voluntariado
    </button>
  </div>
</div>

    <!-- Listado -->
    <div class="listado-voluntariados" id="listadoVoluntariados">
      <!-- Renderizado por JS -->
    </div>
  </main>

  <!-- Modal de detalle -->
  <div class="modal fade" id="modalDetalle" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Detalle del voluntariado</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="detalleContenido">
          <!-- JS rellena el detalle -->
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Bootstrap para añadir/editar voluntariado -->
  <!-- Modal alta/edición -->
<div class="modal fade" id="modalVoluntariado" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <form id="formVoluntariado" class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalLabel">Nuevo voluntariado</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="voluntariadoId">
        <div class="mb-3">
          <label for="categoria" class="form-label">Categoría</label>
          <select id="categoria" class="form-select" required>
            <option value="">Selecciona una categoría</option>
            <option value="idiomas">Idiomas</option>
            <option value="deportes">Deportes</option>
            <option value="profesiones">Profesiones</option>
          </select>
        </div>
        <div class="mb-3">
          <label for="tipo" class="form-label">Tipo</label>
          <select id="tipo" class="form-select" required>
            <option value="">Selecciona tipo</option>
            <option value="oferta">Oferta</option>
            <option value="peticion">Petición</option>
          </select>
        </div>
        <div class="mb-3">
          <label for="titulo" class="form-label">Título</label>
          <input type="text" id="titulo" class="form-control" required>
        </div>
        <div class="mb-3">
          <label for="autor" class="form-label">Autor</label>
          <input type="text" id="autor" class="form-control" required>
        </div>
        <div class="mb-3">
          <label for="modalidad" class="form-label">Modalidad</label>
          <input type="text" id="modalidad" class="form-control" required>
        </div>
        <div class="mb-3">
          <label for="descripcion" class="form-label">Descripción</label>
          <textarea id="descripcion" class="form-control" rows="2" required></textarea>
        </div>
        <div class="mb-3">
          <label for="fecha" class="form-label">Fecha</label>
          <input type="date" id="fecha" class="form-control" required>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar</button>
      </div>
    </form>
  </div>
</div>

    <!-- JS Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
     <!-- JS Vanilla -->
    <script src="js/datos.js"></script>
    <script src="js/voluntariados.js"></script>
    
</body>
</html>
