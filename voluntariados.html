<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>VOLUNET -Gestión de Voluntariados</title>
  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>
<body>
<!-- Barra de navegación  -->
<nav class="my-navbar navbar navbar-expand-lg mb-4">
  <div class="container-fluid d-flex align-items-center justify-content-between">
    <!-- Logo -->
    <a class="navbar-brand d-flex align-items-center" href="index.html">
      <img src="img/volunet_logotipo.png" alt="Volunet Logo" class="logo">
      <span class="brand-name">Volunet</span>
    </a>
    <!-- Voluntariado + Usuarios -->
    <ul class="navbar-nav mx-auto fw-bold">
      <li class="nav-item">
        <a class="nav-link" href="voluntariados.html">📅 Gestión de Voluntariados</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="usuarios.html">👤 Gestión de Usuarios</a>
      </li>
    </ul>
    <!-- Login + Logout -->
    <div class="d-flex align-items-center">
      <span id="userEmail" class="me-3"></span>
      <button id="loginBtn" class="btn btn-success">Iniciar sesión</button>
      <button id="logoutBtn" class="btn btn-danger" style="display:none;">Cerrar sesión</button>
    </div>
  </div>
</nav>

<!-- Alta de los voluntarios -->
<main>
  <section class="mb-5">
    <!-- Botón que abre/cierra el formulario -->
    <label class="btn-toggle" for="toggleForm">+ Añadir nuevo voluntariado</label>
    <input type="checkbox" id="toggleForm" hidden>

    <!-- Contenedor colapsable -->
    <div class="collapse-css" id="formVoluntariadoCollapse">
      <form id="formVoluntariado" class="row g-3 mt-2">
        <!-- Campos del formulario -->
         <!-- Título -->
        <div class="col-md-6">
          <label for="titulo" class="form-label">Título</label>
          <input type="text" id="titulo" class="form-control" required>
        </div>
        <!-- Fecha -->
        <div class="col-md-6">
          <label for="fecha" class="form-label">Fecha</label>
          <input type="date" id="fecha" class="form-control" required>
        </div>
        <!-- Descripción -->
        <div class="col-12">
          <label for="descripcion" class="form-label">Descripción</label>
          <textarea id="descripcion" class="form-control" rows="3" required></textarea>
        </div>
        <!-- Tipo-->
        <div class="col-md-4">
          <label for="tipo" class="form-label">Tipo</label>
          <select id="tipo" class="form-select">
            <option value="Oferta">Oferta</option>
            <option value="Petición">Petición</option>
          </select>
        </div>
        <!-- Modalidad -->
        <div class="col-md-4">
          <label for="modalidad" class="form-label">Modalidad</label>
          <select id="modalidad" class="form-select">
            <option value="Presencial">Presencial</option>
            <option value="Online">Online</option>
          </select>
        </div>
        <!-- Categoría -->
        <div class="col-md-4">
          <label for="categoria" class="form-label">Categoría</label>
          <select id="categoria" class="form-select">
            <option value="Deportes">Deportes</option>
            <option value="Idiomas">Idiomas</option>
            <option value="Profesiones">Profesiones</option>
          </select>
        </div>
        <!-- Botón de añadir -->
        <div class="col-12">
          <button type="submit" class="btn btn-primary btn-sm">Añadir</button>
        </div>
      </form>
    </div>
  </section>
</main>
<!-- Tabla de voluntariados -->
<h2>Lista de voluntariados</h2>
    <table id="tablaVoluntariados" class="table table-striped table-hover mt-3">
      <thead>
        <tr>
          <th>ID</th>
          <th>Título</th>
          <th>Tipo</th>
          <th>Fecha</th>
          <th>Modalidad</th>
          <th>Categoría</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/voluntariados.js"></script>
</body>
</html>
