<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Voluntariados</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <!-- Bootstrap Iconos -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
    <!-- Fuente web Inter de Google Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Inter:400,600,700&display=swap" rel="stylesheet" />
    <!-- CSS personalizado -->
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg navabar-light bg-white border-bottom">
      <div class="container">
        <a href="index.html" class="navbar-brand">
          <img src="assets/img/logo_volunet.png" alt="Logo Volunet" height="50" />
        </a>
        <button type="button" class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a href="index.html" class="nav-link">Dashboard</a>
            </li>
            <li class="nav-item">
              <a href="gestion-voluntariados.html" class="nav-link active">Gestión de voluntariados</a>
            </li>
            <li class="nav-item">
              <a href="gestion-usuarios.html" class="nav-link">Gestión de usuarios</a>
            </li>
            <li class="nav-item">
              <a href="login.html" class="nav-link">Login</a>
            </li>
            <!-- Nombre de usuario o el login actual -->
            <li class="nav-item ms-2">
              <span id="user-info" class="navbar-text text-secondary">- no login -</span>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Contenedor principal de la gestión de voluntariados -->
    <main class="container my-5">
      <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap">
        <h1 class="mb-0 fw-bold fs-1">Gestión de voluntariados</h1>
        <button id="btnAgregarVoluntariado" class="btn btn-primary"><i class="bi bi-plus-circle me-2"></i>Añadir voluntariado</button>
      </div>

      <!-- Listado voluntariados por JS -->
      <div id="lista-voluntariados" class="mb-5"></div>
    </main>

    <!-- Pie de pagina -->
    <footer class="bg-white border-top py-3 mt-auto">
      <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center">
        <div class="text-secondary small mb-2 mb-md-0">© 2025 - Proyecto educativo</div>
        <div>
          <a href="#" class="text-decoration-none">Aviso legal</a>
          <span class="text-secondary mx-2">|</span>
          <a href="#" class="text-decoration-none">Contacto</a>
        </div>
      </div>
    </footer>

    <!-- Modal Alta/Edición Voluntariado -->
    <div class="modal fade" id="modalVoluntariado" tabindex="-1" aria-labelledby="modalVoluntariadoLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <form id="formVoluntariado">
            <div class="modal-header">
              <h5 class="modal-title" id="modalVoluntariadoLabel">Añadir voluntariado</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
              <input type="hidden" id="inputId" />
              <div class="mb-3">
                <label for="inputTitulo" class="form-label">Título</label>
                <input type="text" class="form-control" id="inputTitulo" required />
              </div>
              <div class="mb-3">
                <label for="inputAutor" class="form-label">Autor</label>
                <input type="text" class="form-control" id="inputAutor" required />
              </div>
              <div class="mb-3">
                <label for="inputModalidad" class="form-label">Modalidad</label>
                <input type="text" class="form-control" id="inputModalidad" />
              </div>
              <div class="mb-3">
                <label for="inputTipo" class="form-label">Tipo</label>
                <select class="form-select" id="inputTipo" required>
                  <option value="">Selecciona tipo</option>
                  <option value="oferta">Oferta</option>
                  <option value="peticion">Petición</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="inputCategoria" class="form-label">Categoría</label>
                <select class="form-select" id="inputCategoria" required>
                  <option value="">Selecciona categoría</option>
                  <option value="idiomas">Idiomas</option>
                  <option value="profesiones">Profesiones</option>
                  <option value="deportes">Deportes</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="inputFecha" class="form-label">Fecha</label>
                <input type="date" class="form-control" id="inputFecha" required />
              </div>
              <div class="mb-3">
                <label for="inputDescripcion" class="form-label">Descripción</label>
                <textarea class="form-control" id="inputDescripcion" rows="2"></textarea>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
              <button type="submit" class="btn btn-primary" id="btnGuardarVoluntariado">Guardar</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Modal Detalles Voluntariado -->
    <div class="modal fade" id="modalDetalleVoluntariado" tabindex="-1" aria-labelledby="modalDetalleLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalDetalleLabel">Detalles del voluntariado</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body" id="detalleVoluntariadoBody">
            <!-- Aquí se cargan los datos por JS -->
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal Confirmar Borrado -->
    <div class="modal fade" id="modalBorrarVoluntariado" tabindex="-1" aria-labelledby="modalBorrarLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalBorrarLabel">Eliminar voluntariado</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body">
            <p>¿Seguro que quieres eliminar este voluntariado?</p>
            <p class="fw-bold mb-0" id="borrarVoluntariadoTitulo"></p>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" class="btn btn-danger" id="btnConfirmarBorrar">Eliminar</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <!-- Arrays y objetos de configuración -->
    <script src="js/config.js"></script>
    <!-- Archivo de datos (arrays de voluntariados y usuarios) -->
    <script src="js/datos.js"></script>
    <!-- JS principal -->
    <script src="js/gestion-voluntariados.js"></script>
  </body>
</html>
