<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Voluntariados - Plataforma</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" xintegrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            font-family: "Inter", sans-serif;
            background-color: #f8f9fa;
        }
        .navbar {
            box-shadow: 0 2px 4px rgba(0,0,0,.1);
        }
        .logo {
            height: 200px;
        }
        .form-container {
            background-color: #ffffff;
            border-radius: 8px;
            padding: 2rem;
            box-shadow: 0 4px 12px rgba(0,0,0,.05);
        }
        .table-responsive {
            margin-top: 1.5rem;
        }
        .btn-delete-volunteer {
            color: var(--bs-danger);
        }
        .btn-delete-volunteer:hover {
            color: var(--bs-danger);
            background-color: #fbebee;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-light my-navbar">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <img src="img/logo_voluntariado_sin_fondo.png" alt="Logo Voluntariado" class="logo">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item nav-link-logged-in" style="display: none;">
                        <a class="nav-link" href="index.html" id="nav-link-dashboard"><i class="bi bi-grid-fill"></i> Dashboard</a>
                    </li>
                    <li class="nav-item nav-link-logged-in" style="display: none;">
                        <a class="nav-link active" href="voluntarios.html" id="nav-link-manage-volunteers"><i class="bi bi-clipboard-plus-fill"></i> Gestionar voluntariado</a>
                    </li>
                    <li class="nav-item nav-link-logged-in" style="display: none;">
                        <a class="nav-link" href="usuarios.html" id="nav-link-manage-users"><i class="bi bi-people-fill"></i> Gestionar usuarios</a>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item nav-link-login" style="display: block;">
                        <a class="nav-link" href="login.html" id="nav-link-login-button"><i class="bi bi-box-arrow-in-right"></i> Login</a>
                    </li>
                    <li class="nav-item dropdown nav-link-logged-in" style="display: none;">
                        <a class="nav-link dropdown-toggle" href="#" id="user-dropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-person-circle"></i> <span id="user-email-display"></span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="user-dropdown">
                            <li><a class="dropdown-item" href="#" id="nav-link-logout"><i class="bi bi-box-arrow-right"></i> Logout</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-4 flex-grow-1">

        <div id="page-manage-volunteers">
            <div class="row">
                <div class="col-lg-4 mb-4">
                    <div class="form-container">
                        <h2 class="mb-3">Nuevo voluntariado</h2>
                        <form id="volunteer-form">
                            <div class="mb-3">
                                <label for="volunteer-type" class="form-label">Tipo</label>
                                <select class="form-select" id="volunteer-type" required>
                                    <option value="oferta">Oferta (Ofrezco ayuda)</option>
                                    <option value="peticion">Petición (Necesito ayuda)</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="volunteer-title" class="form-label">Título</label>
                                <input type="text" class="form-control" id="volunteer-title" required>
                            </div>
                            <div class="mb-3">
                                <label for="volunteer-description" class="form-label">Descripción</label>
                                <textarea class="form-control" id="volunteer-description" rows="3" required></textarea>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-success">Añadir voluntariado</button>
                            </div>
                        </form>
                    </div>
                </div>
                <div class="col-lg-8">
                       <div class="form-container">
                            <h2 class="mb-3">Lista de voluntariados</h2>
                            <div class="table-responsive">
                                <table class="table table-striped table-hover align-middle">
                                    <thead class="table-dark">
                                        <tr>
                                            <th>Título</th>
                                            <th>Tipo</th>
                                            <th>Usuario</th>
                                            <th>Acciones</th>
                                        </tr>
                                    </thead>
                                    <tbody id="volunteer-table-body">
                                    </tbody>
                                </table>
                            </div>
                        </div>
                </div>
            </div>
        </div>

    </main>

    <footer class="bg-dark text-white text-center p-3 mt-auto">
        <div class="container">
            <p class="mb-0">&copy; 2025 - Proyecto DAW - Producto 1</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" xintegrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <script src="js/voluntarios.js" type="module"></script>

</body>
</html>
