<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <!-- Bootstrap Iconos -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
    <!-- Fuente web Inter de Google Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Inter:400,600,700&display=swap" rel="stylesheet" />
    <!-- CSS personalizado -->
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg navabar-light bg-white border-bottom">
      <div class="container">
        <a href="index.html" class="navbar-brand">
          <img src="assets/img/logo_volunet.png" alt="Logo Volunet" height="50" />
        </a>
        <button type="button" class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a href="index.html" class="nav-link">Dashboard</a>
            </li>
            <li class="nav-item">
              <a href="gestion-voluntariados.html" class="nav-link">Gestión de voluntariados</a>
            </li>
            <li class="nav-item">
              <a href="gestion-usuarios.html" class="nav-link">Gestión de usuarios</a>
            </li>
            <li class="nav-item">
              <a href="login.html" class="nav-link active">Login</a>
            </li>
            <!-- Nombre de usuario o el login actual -->
            <li class="nav-item ms-2">
              <span id="usuarioNav" class="navbar-text ms-auto d-flex align-items-center gap-2">
                <i class="bi bi-person-circle fs-4 me-1"></i>
                <span id="usuarioNombre">- no login -</span>
                <button id="btnLogout" type="button" class="btn btn-link text-danger btn-sm d-none ms-2" style="text-decoration: none"><i class="bi bi-box-arrow-right"></i> <span class="d-none d-md-inline">Cerrar sesión</span></button>
              </span>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Contenedor login -->
    <main class="container d-flex flex-column align-items-center justify-content-center min-vh-100">
      <div class="login-card card p-4 shadow-sm" style="max-width: 400px; width: 100%; margin: 40px 0">
        <div class="text-center mb-3">
          <img src="/assets/img/logo_volunet.png" alt="Logo" style="width: 250px" />
          <h2 class="fw-bold mt-2">Inicia sesión en tu cuenta</h2>
          <p class="text-muted mb-0">Accede a la plataforma de voluntariado para gestionar tus proyectos.</p>
        </div>
        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label for="loginEmail" class="form-label">Email</label>
            <input type="email" class="form-control" id="loginEmail" required autocomplete="username" />
          </div>
          <div class="mb-3">
            <label for="loginPassword" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="loginPassword" required autocomplete="current-password" />
          </div>
          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="rememberMe" />
            <label class="form-check-label" for="rememberMe">Recordarme</label>
          </div>
          <div class="mb-3">
            <button id="btnLogin" type="submit" class="btn btn-primary w-100" disabled>Iniciar sesión</button>
          </div>
          <div id="loginError" class="alert alert-danger py-1 small d-none" role="alert"></div>
          <div class="text-center">
            <small class="text-muted">¿No tienes cuenta? <a href="#">Regístrate aquí</a></small>
          </div>
        </form>
      </div>
    </main>

    <!-- Pie de pagina -->
    <footer class="bg-white border-top py-3 mt-auto">
      <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center">
        <div class="text-secondary small mb-2 mb-md-0">© 2025 - Proyecto educativo</div>
        <div>
          <a href="#" class="text-decoration-none">Aviso legal</a>
          <span class="text-secondary mx-2">|</span>
          <a href="#" class="text-decoration-none">Contacto</a>
        </div>
      </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <!-- Arrays y objetos de configuración -->
    <script src="js/config.js"></script>
    <!-- Archivo de datos (arrays de voluntariados y usuarios) -->
    <script src="js/datos.js"></script>
    <!-- JS principal -->
    <script src="js/login.js"></script>
  </body>
</html>
