<!DOCTYPE html>
<html lang="es">
<!-- En el encabezado es donde ponemos los enlaces y los metadatos -->
<head>
  <meta charset="UTF-8" />
  <title>VOLUNET - Iniciar Sesión</title>
  <!-- CSS -->
   <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />

</head>

<body>
<!-- Barra de navegación  -->
<nav class="my-navbar navbar navbar-expand-lg mb-4">
  <div class="container-fluid d-flex align-items-center justify-content-between">
    <!-- Logo -->
    <a class="navbar-brand d-flex align-items-center" href="index.html">
      <img src="img/volunet_logotipo.png" alt="Volunet Logo" class="logo">
      <span class="brand-name">Volunet</span>
    </a>
    <!-- Voluntariado + Usuarios -->
    <ul class="navbar-nav mx-auto fw-bold">
      <li class="nav-item">
        <a class="nav-link" href="voluntariados.html">📅 Gestión de Voluntariados</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="usuarios.html">👤 Gestión de Usuarios</a>
      </li>
    </ul>
    <!-- Login + Logout -->
    <div class="d-flex align-items-center">
      <span id="userEmail" class="me-3"></span>
      <button id="loginBtn" class="btn btn-success">Iniciar sesión</button>
      <button id="logoutBtn" class="btn btn-danger" style="display:none;">Cerrar sesión</button>
    </div>
  </div>
</nav>

<!-- Formulario de Login -->
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow p-4 login-card"> 
        <h2>Iniciar Sesión</h2>
        <form id="loginForm">
          <div class="mb-3">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" class="form-control" placeholder="tuemail@mail.com" required />
          </div>
          <div class="mb-3">
            <label for="password">Contraseña</label>
            <input type="password" id="password" class="form-control" placeholder="**************" required />
          </div>
          <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Datos + Identificador -->
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
