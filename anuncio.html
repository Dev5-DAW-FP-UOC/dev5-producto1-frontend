<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="css/style.css">
</head>
    <body>
        <nav class="navbar navbar-expand-lg bg-body-tertiary" >
          <div class="container-fluid mx-3">
            <a class="navbar-brand" href="index.html">
                <img src="./img/logo_volunet.png" alt="Volunet" width="180">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
              <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
              <ul class="navbar-nav">
                <li class="nav-item">
                  <a class="nav-link" href="index.html">Dashboard</a>

                  <a class="nav-link active" aria-current="page" href="#">Anuncios</a>
                </li>

                </li>
              </ul>
              <ul class="navbar-nav ms-auto">
                  <li class="nav-item">
                    <a class="nav-link" href="login.html">Login</a>
                  </li>
                </ul>
            </div>
          </div>
        </nav>


        <div class="container" style="margin-bottom: 50px;">
            <h1 class="title-gestion">Gestión de Voluntariados</h1>
            <div class="accordion" id="accordionVoluntariados">
                <div class="accordion-item">
                    <h2 class="accordion-header" id="headingAlta">
                        <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseAlta" aria-expanded="true" aria-controls="collapseAlta">
                        Alta de Voluntariado
                        </button>
                    </h2>
                    <div id="collapseAlta" class="accordion-collapse collapse" aria-labelledby="headingAlta" data-bs-parent="#accordionVoluntariados">
                        <div class="accordion-body">
                        <!--Titulo-->
                        <div data-mdb-input-init class="form-outline mb-4">
                            <label class="form-label" for="form2Example1">Título</label>
                            <input type="titulo" id="input-titulo" class="form-control" />
                        </div>

                        <!--Usuario-->
                        <label class="form-label" for="form2Example1">Usuario</label>
                        <select class="form-select mb-4" aria-label="Default select example" id="select-user">
                        </select>

                        <!--Fecha-->
                        <div class="mb-3 mt-4">
                            <label for="volDateId" class="form-label">Fecha</label>
                            <input type="date" class="form-control" id="volDateId" name="volDateId">
                        </div>

                        <!--Descripción-->
                        <div data-mdb-input-init class="form-outline mb-4">
                            <label class="form-label" for="form2Example1">Descripción</label>
                            <textarea class="form-control" aria-label="With textarea" id="input-descripcion"></textarea>    
                        </div>

                        <!--Tipo-->
                        <label class="form-label" for="form2Example1">Tipo</label>
                        <select class="form-select mb-4" aria-label="Default select example" id="select-tipo">
                            <option disabled selected value> -- seleccione un tipo -- </option>
                            <option>Petición</option>
                            <option>Oferta</option>
                          </select>

                        <!--Categoría-->
                        <label class="form-label" for="form2Example1">Categoría</label>
                        <select class="form-select mb-4" aria-label="Default select example" id="select-categoria">
                            <option disabled selected value> -- seleccione una categoría -- </option>
                            <option>Idiomas</option>
                            <option>Deportes</option>
                            <option>Profesiones</option>
                          </select>
                        <!--Botón dar de alta-->
                        <div class="d-flex mb-3">
                            <button type="button" class="btn btn-primary" id="dar-alta">Dar de alta</button>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-lg-12">
                        <h2 class="text-center" style="padding-top: 10px;">Consulta y Borrado de Voluntariados</h2>
                        <div class="container bg-light mt-4">
                            <div class="row" id="voluntariados-titulo">
                              <div class="col-2 border p-2">
                                Título
                              </div>
                              <div class="col-2 border p-2">
                                Usuario
                              </div>
                              <div class="col-2 border p-2">
                                Fecha
                              </div>
                              <div class="col-2 border p-2">
                                Descripción
                              </div>
                              <div class="col-1 border p-2">
                                Tipo
                              </div>
                              <div class="col-2 border p-2">
                                Categoría
                              </div>
                              <div class="col-1 border p-2">
                                Acciones
                              </div>
                            </div>
                            <div id="voluntariados-lista">
                            </div>
                          </div>
                    </div>

                </div>

           </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        <script type="module" src="./js/anuncio.js"></script> 

    </body>
</html>
