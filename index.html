<!DOCTYPE html>

    <!-- CSS personalizado -->
    <link rel="stylesheet" href="css/styles.css" />

  <body>
    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg navabar-light bg-white border-bottom">
      <div class="container">
        <a href="index.html" class="navbar-brand">
          <img src="assets/img/logo_volunet.png" alt="Logo Volunet" height="50" />
        </a>
        <button
          type="button"
          class="navbar-toggler"
          data-bs-toggle="collapse"
          data-bs-target="#mainNav"
          aria-controls="mainNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a href="index.html" class="nav-link active">Dashboard</a>

            <li class="nav-item">
              <a href="gestion-voluntariados.html" class="nav-link">Gestión de voluntariados</a>
            </li>
            <li class="nav-item">
              <a href="gestion-usuarios.html" class="nav-link">Gestión de usuarios</a>
            </li>
            <li class="nav-item">
              <a href="login.html" class="nav-link">Login</a>
            </li>
            <!-- Nombre de usuario o el login actual -->
            <li class="nav-item ms-2">
              <span id="user-info" class="navbar-text text-secondary">- no login -</span>
            </li>
          </ul>
        </div>
      </div>
    </nav>

      <!-- Filtros renderizados por JS -->
      <div id="dashboard-filtros" class="mb-4"></div>

      <div id="dashboard-tarjetas" class="row gy-4"></div>

    <footer class="bg-white border-top py-3 mt-auto">

        <div>

    <script
