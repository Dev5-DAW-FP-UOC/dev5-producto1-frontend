        <nav class="navbar navbar-expand-lg bg-body-tertiary" >

            <a class="navbar-brand" href="index.html">
                <img src="./img/logo_volunet.png" alt="Volunet" width="180">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">

            </button>

       <div class="container" style="margin-bottom: 50px;">
            <h1 class="title-gestion">Gestión de Usuarios</h1>
            <div class="accordion" id="accordionUsuarios">
                <div class="accordion-item">
                    <h2 class="accordion-header" id="headingUser">
                        <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseUser" aria-expanded="true" aria-controls="collapseUser">
                        Alta de Usuarios
                        </button>
                    </h2>
                    <div id="collapseUser" class="accordion-collapse collapse" aria-labelledby="headingUser" data-bs-parent="#accordionUsuarios">
                        <div class="accordion-body">
                        <!--Nombre-->
                        <div data-mdb-input-init class="form-outline mb-4">
                            <label class="form-label" for="form2Example1">Nombre</label>
                            <input type="nombre" id="input-nombre" class="form-control" />
                        </div>

                        <!--Correo-->
                        <div data-mdb-input-init class="form-outline mb-4">
                            <label class="form-label" for="form2Example1">Correo</label>
                            <input type="correo" id="input-correo" class="form-control" />
                        </div>

                        <!--Contraseña-->
                        <div data-mdb-input-init class="form-outline mb-4">
                            <label class="form-label" for="form2Example1">Contraseña</label>
                            <input type="contraseña" id="input-contraseña" class="form-control" />
                        </div>

                        <!--Botón dar de alta-->
                        <div class="d-flex mb-3">
                            <button type="button" class="btn btn-primary" id="dar-alta">Dar de alta</button>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-lg-12">
                        <h2 class="text-center" style="padding-top: 10px;">Consulta y Borrado de Usuarios</h2>
                        <div class="container bg-light mt-4">
                            <div class="row" id="usuarios-titulo">
                              <div class="col border p-2">
                                Nombre
                              </div>
                              <div class="col border p-2">
                                Correo
                              </div>
                              <div class="col border p-2">
                                Contraseña
                              </div>
                              <div class="col border p-2">
                                Acciones
                              </div>
                            </div>
                            <div id="usuarios-lista">
                            </div>
                          </div>
                    </div>

                </div>

           </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
